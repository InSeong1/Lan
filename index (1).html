                { std: '천천히', dialects: { gangwon: '천천히', chungcheong: '천천히', gyeongsang: '천천히', jeolla: '천천히', jeju: '천천히' } },
                { std: '있어', dialects: { gangwon: '있어', chungcheong: '있어', gyeongsang: '있어', jeolla: '있어', jeju: '있어' } },
                { std: '없어', dialects: { gangwon: '없어', chungcheong: '없어', gyeongsang: '없어', jeolla: '없어', jeju: '없어' } },
                { std: '가다', dialects: { gangwon: '가다', chungcheong: '가', gyeongsang: '가', jeolla: '가', jeju: '가수다' } },
                { std: '오다', dialects: { gangwon: '오다', chungcheong: '와', gyeongsang: '와', jeolla: '와', jeju: '온수다' } },
                { std: '먹다', dialects: { gangwon: '먹다', chungcheong: '먹어', gyeongsang: '먹어', jeolla: '먹어', jeju: '먹수다' } },
                { std: '하다', dialects: { gangwon: '하다', chungcheong: '해', gyeongsang: '해', jeolla: '해', jeju: '한수다' } },
                { std: '달걀', dialects: { gangwon: '달걀', chungcheong: '달걀', gyeongsang: '달걀', jeolla: '독새기', jeju: '독새기' } },
            ],
            gyeongsang: [
                { std: '호미', dialects: { gangwon: '호미', chungcheong: '호미', gyeongsang: '호미', jeolla: '골갱이', jeju: '골갱이' } },
                { std: '무', dialects: { gangwon: '무', chungcheong: '무', gyeongsang: '무', jeolla: '놈삐', jeju: '놈삐' } },
                { std: '마늘', dialects: { gangwon: '마늘', chungcheong: '마늘', gyeongsang: '마늘', jeolla: '콥대산이', jeju: '콥대산이' } },
                { std: '형', dialects: { gangwon: '형', chungcheong: '형', gyeongsang: '형', jeolla: '형', jeju: '형' } },
                { std: '누나', dialects: { gangwon: '누나', chungcheong: '누나', gyeongsang: '누나', jeolla: '누나', jeju: '누나' } },
                { std: '오빠', dialects: { gangwon: '오빠', chungcheong: '오빠', gyeongsang: '오빠', jeolla: '오빠', jeju: '오빠' } },
                { std: '언니', dialects: { gangwon: '언니', chungcheong: '언니', gyeongsang: '언니', jeolla: '언니', jeju: '언니' } },
                { std: '처녀', dialects: { gangwon: '처녀', chungcheong: '처녀', gyeongsang: '처녀', jeolla: '비바리', jeju: '비바리' } },
                { std: '친족', dialects: { gangwon: '친족', chungcheong: '친족', gyeongsang: '친족', jeolla: '괸당', jeju: '괸당' } },
                { std: '감사합니다', dialects: { gangwon: '감사합니다', chungcheong: '감사합니다', gyeongsang: '감사합니다', jeolla: '감사합니다', jeju: '고맙수다' } },
            ],
            jeolla: [
                { std: '안녕', dialects: { gangwon: '안녕', chungcheong: '안녕', gyeongsang: '안녕', jeolla: '안녕', jeju: '안녕' } },
                { std: '왜', dialects: { gangwon: '왜', chungcheong: '왜', gyeongsang: '왜', jeolla: '왜', jeju: '무사' } },
                { std: '뭐', dialects: { gangwon: '뭐', chungcheong: '뭐', gyeongsang: '뭐', jeolla: '뭐', jeju: '뭐' } },
                { std: '앞으로', dialects: { gangwon: '앞으로', chungcheong: '앞으로', gyeongsang: '앞으로', jeolla: '앞으로', jeju: '앞으로' } },
                { std: '보다', dialects: { gangwon: '보다', chungcheong: '봐', gyeongsang: '봐', jeolla: '봐', jeju: '봤수다' } },
                { std: '자다', dialects: { gangwon: '자다', chungcheong: '자', gyeongsang: '자', jeolla: '자', jeju: '자수다' } },
                { std: '놀다', dialects: { gangwon: '놀다', chungcheong: '놀아', gyeongsang: '놀아', jeolla: '놀아', jeju: '노우다' } },
                { std: '물어보다', dialects: { gangwon: '물어보다', chungcheong: '물어봐', gyeongsang: '물어봐', jeolla: '물어봐', jeju: '물어봤수다' } },
                { std: '예뻐', dialects: { gangwon: '예뻐', chungcheong: '예뻐', gyeongsang: '예뻐', jeolla: '예뻐', jeju: '예뻐' } },
                { std: '크다', dialects: { gangwon: '크다', chungcheong: '크다', gyeongsang: '크다', jeolla: '크다', jeju: '크다' } },
            ],
            jeju: [
                { std: '아저씨', dialects: { gangwon: '아저씨', chungcheong: '아저씨', gyeongsang: '아저씨', jeolla: '아저씨', jeju: '아즈방' } },
                { std: '아주머니', dialects: { gangwon: '아주머니', chungcheong: '아주머니', gyeongsang: '아주머니', jeolla: '아주머니', jeju: '아즈망' } },
                { std: '어떻게', dialects: { gangwon: '어떻게', chungcheong: '어떻게', gyeongsang: '어떻게', jeolla: '어떻게', jeju: '어떵' } },
                { std: '뭘하니', dialects: { gangwon: '뭘하니', chungcheong: '뭘하니', gyeongsang: '뭘하니', jeolla: '뭘하니', jeju: '무신거' } },
                { std: '따뜻하다', dialects: { gangwon: '따뜻하다', chungcheong: '따뜻하다', gyeongsang: '따뜻하다', jeolla: '따뜻하다', jeju: '맨드롱' } },
                { std: '왜그래', dialects: { gangwon: '왜그래', chungcheong: '왜그래', gyeongsang: '왜그래', jeolla: '왜그래', jeju: '무사 고람수꽈' } },
                { std: '보기', dialects: { gangwon: '보기', chungcheong: '보기', gyeongsang: '보기', jeolla: '보기', jeju: '왕 봐' } },
                { std: '아름답다', dialects: { gangwon: '아름답다', chungcheong: '아름답다', gyeongsang: '아름답다', jeolla: '아름답다', jeju: '곱들락' } },
                { std: '부지런하다', dialects: { gangwon: '부지런하다', chungcheong: '부지런하다', gyeongsang: '부지런하다', jeolla: '부지런하다', jeju: '둥그리멍' } },
                { std: '살다', dialects: { gangwon: '살다', chungcheong: '살다', gyeongsang: '살다', jeolla: '살다', jeju: '살다' } },
            ],
        };

        const MATCHING_PAIRS = {
            gangwon: [
                { id: 1, std: '안녕하세요', dialect: '안녕하세요' },
                { id: 2, std: '빨리', dialect: '얼렁' },
                { id: 3, std: '아버지', dialect: '아부지' },
                { id: 4, std: '고마워', dialect: '고마워' },
                { id: 5, std: '많이', dialect: '많이' },
            ],
            chungcheong: [
                { id: 1, std: '안녕하세요', dialect: '안녕하유' },
                { id: 2, std: '조금', dialect: '쪼매' },
                { id: 3, std: '고마워요', dialect: '고마워유' },
                { id: 4, std: '좋아요', dialect: '좋아유' },
                { id: 5, std: '빨리', dialect: '얼렁' },
            ],
            gyeongsang: [
                { id: 1, std: '안녕하세요', dialect: '안녕하세예' },
                { id: 2, std: '빨리', dialect: '퍼뜩' },
                { id: 3, std: '많이', dialect: '천지' },
                { id: 4, std: '밥먹었어', dialect: '밥 먹었나' },
                { id: 5, std: '좋아요', dialect: '좋아예' },
            ],
            jeolla: [
                { id: 1, std: '안녕하세요', dialect: '안녕하시요' },
                { id: 2, std: '많이', dialect: '허벌나게' },
                { id: 3, std: '빨리', dialect: '얼릉' },
                { id: 4, std: '조금', dialect: '쪼금' },
                { id: 5, std: '밥먹었어', dialect: '밥 먹었냐' },
            ],
            jeju: [
                { id: 1, std: '안녕하세요', dialect: '안녕하십서' },
                { id: 2, std: '할아버지', dialect: '하르방' },
                { id: 3, std: '왜', dialect: '무사' },
                { id: 4, std: '아버지', dialect: '아방' },
                { id: 5, std: '빨리', dialect: '혼저' },
            ],
        };

        const BLANK_SENTENCES = {
            gangwon: [
                { sentence: '____ (안녕하세요)', blank: '안녕하세요' },
                { sentence: '____ (빨리)', blank: '얼렁' },
                { sentence: '____ (아버지)', blank: '아부지' },
                { sentence: '____ (고마워)', blank: '고마워' },
            ],
            chungcheong: [
                { sentence: '____ (안녕하세요)', blank: '안녕하유' },
                { sentence: '____ (조금)', blank: '쪼매' },
                { sentence: '____ (고마워요)', blank: '고마워유' },
                { sentence: '____ (좋아요)', blank: '좋아유' },
            ],
            gyeongsang: [
                { sentence: '____ (안녕하세요)', blank: '안녕하세예' },
                { sentence: '____ (빨리)', blank: '퍼뜩' },
                { sentence: '____ (많이)', blank: '천지' },
                { sentence: '____ (좋아요)', blank: '좋아예' },
            ],
            jeolla: [
                { sentence: '____ (안녕하세요)', blank: '안녕하시요' },
                { sentence: '____ (많이)', blank: '허벌나게' },
                { sentence: '____ (빨리)', blank: '얼릉' },
                { sentence: '____ (조금)', blank: '쪼금' },
            ],
            jeju: [
                { sentence: '____ (안녕하세요)', blank: '안녕하십서' },
                { sentence: '____ (할아버지)', blank: '하르방' },
                { sentence: '____ (왜)', blank: '무사' },
                { sentence: '____ (아버지)', blank: '아방' },
            ],
        };

        const QUIZ_DATA = [
            { q: "경상도에서 '많이'는?", opts: ["많이", "천지", "허벌나게", "하영"], ans: 1, exp: "'천지'는 경상도 사투리입니다!" },
            { q: "충청도에서 '조금'은?", opts: ["조금", "쪼매", "쪼금", "호꼼"], ans: 1, exp: "'쪼매'는 충청도 사투리입니다!" },
            { q: "제주도에서 '왜'는?", opts: ["왜", "무사", "와", "뭐"], ans: 1, exp: "'무사'는 제주도의 가장 신기한 표현입니다!" },
            { q: "전라도에서 '많이'는?", opts: ["천지", "허벌나게", "많이", "하영"], ans: 1, exp: "'허벌나게'는 전라도의 독특한 표현입니다!" },
            { q: "강원도에서 '빨리'는?", opts: ["얼렁", "퍼뜩", "얼릉", "혼저"], ans: 0, exp: "'얼렁'은 강원도와 충청도의 표현입니다!" },
        ];

        let state = {
            tab: 'translator',
            selectedRegion: 'gangwon',
            matchRegion: 'gangwon',
            blankRegion: 'gangwon',
            dictRegion: 'gangwon',
            quizIdx: 0,
            quizScore: 0,
            quizAnswered: false,
            quizSelectedAnswer: null,
            quizDone: false,
        };

        function translate(text, region) {
            if (!text) return '';
            let result = text.trim();
            if (DICTIONARY[region] && DICTIONARY[region][result]) {
                return DICTIONARY[region][result];
            }
            return '';
        }

        function init() {
            initRegions('regionsContainer', 'selectedRegion');
            initRegions('matchRegionContainer', 'matchRegion');
            initRegions('blankRegionContainer', 'blankRegion');
            initRegions('dictRegionContainer', 'dictRegion');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => switchTab(e.target.dataset.tab));
            });
            document.getElementById('inputText').addEventListener('input', updateTranslator);
            document.getElementById('copyBtn').addEventListener('click', copyText);
            updateTranslator();
            renderQuiz();
            renderMatching();
            renderBlanks();
            renderDictionary();
        }

        function initRegions(containerId, stateKey) {
            const container = document.getElementById(containerId);
            container.innerHTML = REGIONS.map(r => `<button class="region-btn ${r.id === state[stateKey] ? 'active' : ''}" data-region="${r.id}"><div class="region-icon">${r.icon}</div><div class="region-name">${r.name}</div></button>`).join('');
            container.querySelectorAll('.region-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state[stateKey] = e.currentTarget.dataset.region;
                    init();
                });
            });
        }

        function switchTab(tab) {
            state.tab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(tab).style.display = 'block';
        }

        function updateTranslator() {
            const input = document.getElementById('inputText').value.trim();
            const output = translate(input, state.selectedRegion);
            const outputEl = document.getElementById('outputText');
            const copyBtn = document.getElementById('copyBtn');
            if (output) {
                outputEl.textContent = `"${output}"`;
                copyBtn.style.display = 'block';
            } else {
                outputEl.textContent = '문장을 입력하세요!';
                copyBtn.style.display = 'none';
            }
            const examples = EXAMPLES[state.selectedRegion];
            if (examples) {
                document.getElementById('examplesContainer').innerHTML = `<div class="example-title">📚 ${REGIONS.find(r => r.id === state.selectedRegion).name} 사투리 예시:</div>${examples.map(ex => `<div class="example-item"><span class="example-std">${ex.std}</span> → <span class="example-dialect">${ex.dialect}</span></div>`).join('')}`;
            }
        }

        function copyText() {
            const output = document.getElementById('outputText').textContent;
            navigator.clipboard.writeText(output.replace(/"/g, ''));
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✅ 복사됨!';
            setTimeout(() => { btn.textContent = '📋 복사'; }, 1500);
        }

        function renderQuiz() {
            const quizContainer = document.getElementById('quizContent');
            const q = QUIZ_DATA[state.quizIdx];
            if (state.quizDone) {
                quizContainer.innerHTML = `<div class="result"><div class="result-emoji">🏆</div><div class="result-title">퀴즈 완료!</div><div class="result-score">${QUIZ_DATA.length}문제 중 <span class="score-highlight">${state.quizScore}</span>문제 맞음!</div><button class="reset-btn" onclick="resetQuiz()">🔄 다시 풀기</button></div>`;
                return;
            }
            quizContainer.innerHTML = `<div class="section"><div class="quiz-header"><span>문제 ${state.quizIdx + 1} / ${QUIZ_DATA.length}</span><span>점수: ${state.quizScore}</span></div><div class="quiz-question">Q. ${q.q}</div><div class="quiz-options">${q.opts.map((opt, i) => `<button class="option-btn" onclick="answerQuiz(${i})" ${state.quizAnswered ? 'disabled' : ''}>${i + 1}. ${opt}</button>`).join('')}</div>${state.quizAnswered ? `<div class="feedback"><div class="feedback-title">${state.quizSelectedAnswer === q.ans ? '✅ 정답!' : '❌ 틀렸어요!'}</div><div class="feedback-text">${q.exp}</div><button class="next-btn" onclick="nextQuiz()">${state.quizIdx + 1 === QUIZ_DATA.length ? '결과 확인' : '다음 문제 ➜'}</button></div>` : ''}</div>`;
            if (state.quizAnswered) {
                document.querySelectorAll('.option-btn').forEach((btn, i) => {
                    btn.classList.remove('correct', 'wrong', 'disabled');
                    if (i === q.ans) btn.classList.add('correct');
                    else if (i === state.quizSelectedAnswer) btn.classList.add('wrong');
                    else btn.classList.add('disabled');
                });
            }
        }

        function answerQuiz(idx) {
            if (state.quizAnswered) return;
            state.quizSelectedAnswer = idx;
            state.quizAnswered = true;
            if (idx === QUIZ_DATA[state.quizIdx].ans) {
                state.quizScore++;
            }
            renderQuiz();
        }

        function nextQuiz() {
            if (state.quizIdx + 1 < QUIZ_DATA.length) {
                state.quizIdx++;
                state.quizAnswered = false;
                state.quizSelectedAnswer = null;
            } else {
                state.quizDone = true;
            }
            renderQuiz();
        }

        function resetQuiz() {
            state.quizIdx = 0;
            state.quizScore = 0;
            state.quizAnswered = false;
            state.quizSelectedAnswer = null;
            state.quizDone = false;
            renderQuiz();
        }

        function renderMatching() {
            const pairs = MATCHING_PAIRS[state.matchRegion];
            const container = document.getElementById('matchingGameContent');
            const shuffledDialect = [...pairs].sort(() => Math.random() - 0.5);
            container.innerHTML = `<div class="section"><div class="matching-grid"><div class="matching-column"><div style="font-weight: bold; margin-bottom: 10px;">표준어</div>${pairs.map((p) => `<button class="match-item" data-type="std" data-id="${p.id}">${p.std}</button>`).join('')}</div><div class="matching-column"><div style="font-weight: bold; margin-bottom: 10px;">사투리</div>${shuffledDialect.map((p) => `<button class="match-item" data-type="dialect" data-id="${p.id}">${p.dialect}</button>`).join('')}</div></div><div class="match-score" id="matchScore" style="display:none;"></div></div>`;
            initMatchingGame();
        }

        function initMatchingGame() {
            let selectedStd = null;
            const pairs = MATCHING_PAIRS[state.matchRegion];
            const matchedPairs = new Set();
            document.querySelectorAll('.match-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const btn = e.currentTarget;
                    const type = btn.dataset.type;
                    const id = btn.dataset.id;
                    if (btn.classList.contains('matched')) return;
                    if (type === 'std') {
                        document.querySelectorAll('.match-item[data-type="std"]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedStd = id;
                    } else {
                        if (!selectedStd) return;
                        if (selectedStd == id) {
                            document.querySelectorAll(`.match-item[data-id="${id}"]`).forEach(b => {
                                b.classList.remove('selected');
                                b.classList.add('matched');
                            });
                            matchedPairs.add(parseInt(id));
                            selectedStd = null;
                            if (matchedPairs.size === pairs.length) {
                                setTimeout(() => {
                                    document.getElementById('matchScore').style.display = 'block';
                                    document.getElementById('matchScore').innerHTML = `🎉 모두 맞췄어요! 완벽합니다!<button class="reset-match-btn" onclick="location.reload()">처음부터</button>`;
                                }, 300);
                            }
                        } else {
                            btn.classList.add('wrong');
                            setTimeout(() => btn.classList.remove('wrong'), 500);
                        }
                    }
                });
            });
        }

        function renderBlanks() {
            const sentences = BLANK_SENTENCES[state.blankRegion];
            const container = document.getElementById('blankGameContent');
            container.innerHTML = `<div class="section"><div class="blank-game">${sentences.map((s, i) => `<div style="margin: 15px 0;"><div>${s.sentence}</div><input type="text" class="blank-input" id="blank-${i}" placeholder="정답 입력"><button class="check-btn" onclick="checkBlank(${i}, '${s.blank}')">확인</button></div>`).join('')}</div></div>`;
        }

        function checkBlank(idx, answer) {
            const input = document.getElementById(`blank-${idx}`);
            if (input.value === answer) {
                input.style.background = '#dcfce7';
                input.style.borderColor = '#22c55e';
            } else {
                input.style.background = '#fee2e2';
                input.style.borderColor = '#ef4444';
            }
        }

        function renderDictionary() {
            const words = DICTIONARY_DATA[state.dictRegion];
            const container = document.getElementById('dictionaryContent');
            container.innerHTML = `<div class="section"><div class="dictionary-grid">${words.map(w => `<div class="dict-card"><div class="dict-std">${w.std}</div><div class="dict-labels">${Object.entries(w.dialects).map(([region, dialect]) => `<span class="dict-label">${REGIONS.find(r => r.id === region).name}: ${dialect}</span>`).join('')}</div></div>`).join('')}</div></div>`;
        }

        init();
    </script>
