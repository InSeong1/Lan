<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5e9">
    <title>신나는 팔도 사투리 탐험대!</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInFromBottom { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInFromTop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-in-out; }
        .animate-slide-bottom { animation: slideInFromBottom 0.5s ease-out; }
        .animate-slide-top { animation: slideInFromTop 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        const REGIONS = [
            { id: 'seoul', name: '표준어(서울)', color: 'bg-slate-100', borderColor: 'border-slate-300', icon: '🏙️' },
            { id: 'gangwon', name: '강원도', color: 'bg-green-100', borderColor: 'border-green-300', icon: '🌲' },
            { id: 'chungcheong', name: '충청도', color: 'bg-indigo-100', borderColor: 'border-indigo-300', icon: '🌾' },
            { id: 'gyeongsang', name: '경상도', color: 'bg-orange-100', borderColor: 'border-orange-300', icon: '🌊' },
            { id: 'jeolla', name: '전라도', color: 'bg-yellow-100', borderColor: 'border-yellow-300', icon: '🍚' },
            { id: 'jeju', name: '제주도', color: 'bg-teal-100', borderColor: 'border-teal-300', icon: '🍊' },
        ];

        const ENDING_RULES = [
            { regex: /는\s*거(?:야|에?요)\?$/, gangwon: '는 거우과?', chungcheong: '는 겨?', gyeongsang: '는 기가?', jeolla: '는 거여?', jeju: '는 거우꽈?' },
            { regex: /을\s*거(?:야|에?요)\?$/, gangwon: '을 거우과?', chungcheong: '을 겨?', gyeongsang: '을 기가?', jeolla: '을 거여?', jeju: '을 거우꽈?' },
            { regex: /거(?:야|에?요)\?$/, gangwon: '거우과?', chungcheong: '겨?', gyeongsang: '기가?', jeolla: '거여?', jeju: '거우꽈?' },
            { regex: /(았|었|했)어\?$/, gangwon: '$1우과?', chungcheong: '$1슈?', gyeongsang: '$1나?', jeolla: '$1냐?', jeju: '$1수꽈?' },
            { regex: /해\?$/, gangwon: '하우과?', chungcheong: '혀?', gyeongsang: '하나?', jeolla: '하냐?', jeju: '허멘?' },
            { regex: /([가-힣])야\?$/, gangwon: '$1우과?', chungcheong: '$1여?', gyeongsang: '$1가?', jeolla: '$1냐?', jeju: '$1우꽈?' },
            { regex: /([가-힣])(?:어|아)\?$/, gangwon: '$1우과?', chungcheong: '$1여?', gyeongsang: '$1노?', jeolla: '$1냐?', jeju: '$1수꽈?' },
            { regex: /(?:니|냐|나)\?$/, gangwon: '우과?', chungcheong: '겨?', gyeongsang: '노?', jeolla: '냐?', jeju: '멘?' },
            { regex: /잖아(?:요)?\?$/, gangwon: '잖소?', chungcheong: '잖아유?', gyeongsang: '다 아이가?', jeolla: '제?', jeju: '잖아마씸?' },
            { regex: /(?:시)?나요\?$/, gangwon: '신교?', chungcheong: '셔유?', gyeongsang: '능교?', jeolla: '신가요?', jeju: '시멘?' },
            { regex: /가요\?$/, gangwon: '교?', chungcheong: '겨?', gyeongsang: '교?', jeolla: '가요?', jeju: '가마씸?' },
            { regex: /습니까\?$/, gangwon: '우과?', chungcheong: '신겨?', gyeongsang: '십니꺼?', jeolla: '신가요?', jeju: '십네꽈?' },
            { regex: /세요\?$/, gangwon: '우과?', chungcheong: '셔유?', gyeongsang: '십니꺼?', jeolla: '쇼?', jeju: '우꽈?' },
            { regex: /지(?:요)?\?$/, gangwon: '지용?', chungcheong: '지유?', gyeongsang: '제?', jeolla: '지용?', jeju: '지예?' },
            { regex: /([가-힣])요\?$/, gangwon: '$1우과?', chungcheong: '$1대유?', gyeongsang: '$1예?', jeolla: '$1는가요?', jeju: '$1우과?' },
        ];

        const QUIZ_DATA = [
            { question: "제주도 사투리 '무사 가물락하맨?'에서 '무사'의 뜻은 무엇일까요?", options: ["왜 (Why)", "무사 (칼을 든 전사)", "아무 일 없이", "빨리"], correct: 0, explanation: "제주도 사투리에서 '무사'는 '왜'라는 뜻이에요! '무사 가물락하맨?'은 '왜 어두컴컴하니?'라는 뜻이랍니다." },
            { question: "충청도 사투리로 '너 어디 가니?'를 가장 자연스럽게 바꾼 것은?", options: ["너 어디 가유?", "너 어디 가슈?", "너 어데 가는겨?", "너 어데 가셔유?"], correct: 2, explanation: "충청도에서는 가벼운 의문을 나타낼 때 '~겨?'를 아주 자주 사용해요! (예: 밥 먹은겨?)" },
            { question: "경상도에서 '천지빼까리다'라고 하면 어떤 상황일까요?", options: ["아무것도 없다", "사방에 널려있을 정도로 엄청나게 많다", "너무 맵다", "날씨가 춥다"], correct: 1, explanation: "'천지빼까리다'는 발에 채일 정도로 아주 흔하고 많다는 뜻의 재미있는 사투리예요." },
            { question: "전라도 사투리에서 깜짝 놀랐을 때 쓰는 구수한 감탄사는 무엇일까요?", options: ["아따", "오메", "시방", "거시기"], correct: 1, explanation: "'오메'는 전라도(또는 충청도 일부)에서 깜짝 놀랐을 때 '어머나!' 대신 아주 찰지게 쓰는 감탄사예요." },
            { question: "강원도 사투리로 '모두 다 모였어?'를 바르게 표현한 것은?", options: ["다들 모였우과?", "마카 다 모였우과?", "천지 모였우과?", "얼렁 모였우과?"], correct: 1, explanation: "강원도에서는 '모두, 전부'라는 뜻으로 '마카'라는 재미있는 단어를 쓴답니다." }
        ];

        function translate(text, regionId) {
            if (!text || regionId === 'seoul') return text;
            let result = text;
            for (const rule of ENDING_RULES) {
                if (regionId in rule) {
                    const dialectEnding = rule[regionId];
                    result = result.replace(rule.regex, dialectEnding);
                }
            }
            return result;
        }

        function Translator() {
            const [inputText, setInputText] = useState('');
            const [selectedRegion, setSelectedRegion] = useState('gangwon');
            const [copied, setCopied] = useState(false);

            const translatedText = translate(inputText, selectedRegion);
            const currentRegion = REGIONS.find(r => r.id === selectedRegion);

            const handleCopy = () => {
                navigator.clipboard.writeText(translatedText);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const handlePlaySound = () => {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(translatedText);
                    utterance.lang = 'ko-KR';
                    speechSynthesis.cancel();
                    speechSynthesis.speak(utterance);
                }
            };

            return (
                <div className="space-y-6">
                    <section className="bg-white rounded-3xl shadow-lg p-8">
                        <h2 className="text-2xl font-bold text-slate-800 mb-4">표준어 입력</h2>
                        <textarea value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="번역하고 싶은 문장을 입력하세요. (예: 밥 먹었어?)" className="w-full p-4 border-2 border-slate-200 rounded-xl focus:border-sky-500 focus:outline-none resize-none" rows="4" />
                    </section>

                    <section className="bg-white rounded-3xl shadow-lg p-8">
                        <h2 className="text-2xl font-bold text-slate-800 mb-6">방언 선택</h2>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                            {REGIONS.map(region => (
                                <button key={region.id} onClick={() => setSelectedRegion(region.id)} className={`p-4 rounded-2xl font-bold transition-all ${selectedRegion === region.id ? `${region.color} border-2 ${region.borderColor} shadow-md scale-105` : `${region.color} border-2 border-transparent hover:${region.borderColor}`}`}>
                                    <div className="text-2xl mb-1">{region.icon}</div>
                                    <div className="text-sm md:text-base">{region.name}</div>
                                </button>
                            ))}
                        </div>
                    </section>

                    <section className={`rounded-3xl shadow-lg p-8 ${currentRegion?.color}`}>
                        <h2 className="text-2xl font-bold mb-4 text-slate-800">{currentRegion?.icon} {currentRegion?.name} 사투리</h2>
                        {translatedText ? (
                            <div className={`${currentRegion?.color} rounded-2xl p-6`}>
                                <p className="text-3xl md:text-4xl font-bold leading-tight break-keep text-slate-800 mb-4">"{translatedText}"</p>
                                <div className="flex gap-2 flex-wrap">
                                    <button onClick={handlePlaySound} className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-full font-bold transition">🔊 발음 듣기</button>
                                    <button onClick={handleCopy} className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-full font-bold transition">{copied ? '✅ 복사됨!' : '📋 복사하기'}</button>
                                </div>
                            </div>
                        ) : (
                            <p className="text-xl text-slate-500">위에서 문장을 입력하고 지역을 선택하세요!</p>
                        )}
                    </section>
                </div>
            );
        }

        function Quiz() {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [isAnswered, setIsAnswered] = useState(false);

            const handleAnswer = (index) => {
                if (isAnswered) return;
                setSelectedAnswer(index);
                setIsAnswered(true);
                if (index === QUIZ_DATA[currentIndex].correct) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentIndex + 1 < QUIZ_DATA.length) {
                    setCurrentIndex(currentIndex + 1);
                    setSelectedAnswer(null);
                    setIsAnswered(false);
                } else {
                    setShowResult(true);
                }
            };

            const resetQuiz = () => {
                setCurrentIndex(0);
                setScore(0);
                setShowResult(false);
                setSelectedAnswer(null);
                setIsAnswered(false);
            };

            if (showResult) {
                const percentage = Math.round((score / QUIZ_DATA.length) * 100);
                const feedbackMessage = score === QUIZ_DATA.length ? '완벽해요! 당신은 사투리 척척박사입니다! 👨‍🎓👩‍🎓' : score >= 3 ? '잘했어요! 지역 방언에 대해 많이 알고 있군요! 👍' : '괜찮아요! 이번 기회에 새로운 사투리를 많이 배웠죠? 😉';
                return (
                    <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl text-center max-w-2xl mx-auto animate-slide-bottom">
                        <div className="text-6xl mb-6">🏆</div>
                        <h2 className="text-3xl font-extrabold text-slate-800 mb-4">퀴즈 완료! 🎉</h2>
                        <p className="text-xl text-slate-600 mb-6">총 {QUIZ_DATA.length}문제 중 <strong className="text-3xl text-orange-500 mx-2">{score}</strong>문제를 맞혔어요!</p>
                        <div className="mb-8"><div className="w-full bg-slate-200 rounded-full h-4 overflow-hidden"><div className="bg-gradient-to-r from-orange-400 to-orange-600 h-full transition-all duration-500" style={{ width: `${percentage}%` }} /></div><p className="mt-2 font-bold text-orange-600">{percentage}% 달성!</p></div>
                        <div className="bg-orange-50 p-6 rounded-2xl mb-8"><p className="text-lg font-bold text-orange-700">{feedbackMessage}</p></div>
                        <button onClick={resetQuiz} className="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-full font-bold text-lg shadow-md transition-colors inline-flex items-center gap-2">🔄 퀴즈 다시 풀기</button>
                    </div>
                );
            }

            const q = QUIZ_DATA[currentIndex];
            return (
                <div className="max-w-2xl mx-auto animate-in">
                    <div className="bg-white rounded-3xl shadow-lg border-t-4 border-orange-400 overflow-hidden">
                        <div className="bg-orange-50 p-6 border-b border-orange-100 flex justify-between items-center">
                            <span className="font-bold text-orange-600 bg-orange-200 px-4 py-1 rounded-full">문제 {currentIndex + 1} / {QUIZ_DATA.length}</span>
                            <span className="font-bold text-slate-500">현재 점수: {score}점</span>
                        </div>
                        <div className="p-8">
                            <h3 className="text-2xl font-bold text-slate-800 mb-8 leading-snug">Q. {q.question}</h3>
                            <div className="space-y-3">
                                {q.options.map((option, index) => {
                                    let btnClass = 'bg-white border-2 border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-orange-300';
                                    if (isAnswered) {
                                        if (index === q.correct) btnClass = 'bg-green-100 border-2 border-green-500 text-green-800 font-bold';
                                        else if (index === selectedAnswer) btnClass = 'bg-red-50 border-2 border-red-400 text-red-600';
                                        else btnClass = 'bg-slate-50 border-2 border-slate-100 text-slate-400 opacity-50';
                                    }
                                    return <button key={index} onClick={() => handleAnswer(index)} disabled={isAnswered} className={`w-full text-left p-4 rounded-xl text-lg font-medium transition-all ${btnClass}`}><span className="inline-block w-8 text-slate-400">{index + 1}.</span> {option}</button>;
                                })}
                            </div>
                            {isAnswered && (
                                <div className="mt-8 p-6 bg-slate-50 rounded-2xl animate-slide-top">
                                    <div className="flex items-start gap-3 mb-4">
                                        <div className="text-2xl">{selectedAnswer === q.correct ? '✅' : '❌'}</div>
                                        <div>
                                            <h4 className={`font-bold text-lg mb-1 ${selectedAnswer === q.correct ? 'text-green-600' : 'text-red-600'}`}>{selectedAnswer === q.correct ? '정답입니다!' : '아쉽네요, 틀렸어요!'}</h4>
                                            <p className="text-slate-700 font-medium">{q.explanation}</p>
                                        </div>
                                    </div>
                                    <button onClick={nextQuestion} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-colors mt-4">{currentIndex + 1 === QUIZ_DATA.length ? '결과 확인하기' : '다음 문제로 넘어가기'} ➜</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('translator');
            return (
                <div className="min-h-screen bg-sky-50 font-sans pb-12">
                    <header className="bg-white shadow-sm pt-8 pb-6 px-4 text-center">
                        <h1 className="text-3xl md:text-4xl font-extrabold text-sky-800 flex items-center justify-center gap-3">🗺️ 신나는 팔도 사투리 탐험대!</h1>
                        <p className="mt-3 text-slate-600 text-lg">우리나라의 아름답고 다양한 지역 말을 알아보아요 🎒</p>
                    </header>
                    <div className="flex justify-center mt-6 px-4">
                        <div className="bg-white rounded-full p-1 shadow-md inline-flex">
                            <button onClick={() => setActiveTab('translator')} className={`px-6 md:px-8 py-2 md:py-3 rounded-full font-bold transition-all ${activeTab === 'translator' ? 'bg-sky-500 text-white shadow-md' : 'text-slate-600 hover:text-sky-500'}`}>🗣️ 사투리 번역기</button>
                            <button onClick={() => setActiveTab('quiz')} className={`px-6 md:px-8 py-2 md:py-3 rounded-full font-bold transition-all ${activeTab === 'quiz' ? 'bg-orange-500 text-white shadow-md' : 'text-slate-600 hover:text-orange-500'}`}>🎯 사투리 퀴즈</button>
                        </div>
                    </div>
                    <main className="max-w-4xl mx-auto px-4 mt-8">
                        {activeTab === 'translator' && <Translator />}
                        {activeTab === 'quiz' && <Quiz />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
