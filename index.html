        // 문장 분석 및 자연스러운 어미 변환 번역 함수 (고정 문구 오류 수정 완료)
        function translate(text, region) {
            if (!text) return '';
            let cleanText = text.trim().toLowerCase();
            let dict = DICTIONARY[region];

            if (dict[cleanText]) {
                return dict[cleanText];
            }

            for (let key in dict) {
                if (cleanText.includes(key)) {
                    return dict[key];
                }
            }

            if (cleanText.includes('뭐하') || cleanText.includes('뭐 하') || cleanText.includes('지금 뭐')) {
                if (region === 'gangwon') return '무사 허냐?';
                if (region === 'chungcheong') return '뭐 허냐?';
                if (region === 'gyeongsang') return '머하노?';
                if (region === 'jeolla') return '머 허냐잉?';
                if (region === 'jeju') return '무사 허광?';
            }
            if (cleanText.includes('밥')) {
                if (region === 'gangwon') return '밥 묵었나이?';
                if (region === 'chungcheong') return '밥 먹었슈?';
                if (region === 'gyeongsang') return '밥 묵었나?';
                if (region === 'jeolla') return '밥 먹었냐잉?';
                if (region === 'jeju') return '밥 먹었수꽈?';
            }
            if (cleanText.includes('수고') || cleanText.includes('고생')) {
                if (region === 'gangwon') return '수고 마이 하셨드래요~';
                if (region === 'chungcheong') return '고생했어유~';
                if (region === 'gyeongsang') return '고생했어예~';
                if (region === 'jeolla') return '고생해부렀어~';
                if (region === 'jeju') return '폭싹 속았수다';
            }
            if (cleanText.includes('잘생겼') || cleanText.includes('멋지')) {
                if (region === 'gangwon') return '참 잘생겼구먼유~';
                if (region === 'chungcheong') return '참 잘생겼구먼유~';
                if (region === 'gyeongsang') return '참 쎄빠지게 잘생겼다예~';
                if (region === 'jeolla') return '허벌나게 잘생겨 부렀네~';
                if (region === 'jeju') return '곱들락하게 잘생겼수다양~';
            }

            // 미등록 문장의 경우 고정된 문구가 아니라 입력한 문장의 종결 어미나 느낌을 살려 동적으로 변환
            let coreText = text.replace(/[.?!~]/g, '').trim();
            const regionalEndings = {
                gangwon: { suffix: '드래요~', question: '나이?' },
                chungcheong: { suffix: '유~', question: '슈?' },
                gyeongsang: { suffix: '예~', question: '나예?' },
                jeolla: { suffix: '부러~', question: '냐잉?' },
                jeju: { suffix: '수다양~', question: '수꽈?' }
            };

            let rule = regionalEndings[region] || { suffix: '요~', question: '요?' };
            if (text.includes('?')) {
                return `${coreText} ${rule.question}`;
            } else {
                return `${coreText} ${rule.suffix}`;
            }
        }

            container.innerHTML = REGIONS.map(r => `<button type="button" class="region-btn ${r.id === state[stateKey] ? 'active' : ''}" data-region="${r.id}"><div class="region-icon">${r.icon}</div><div class="region-name">${r.name}</div></button>`).join('');

                    init();
                });
            });

            state.tab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            const targetBtn = document.querySelector(`[data-tab="${tab}"]`);
            const targetContent = document.getElementById(tab);
            if (targetBtn) targetBtn.classList.add('active');
            if (targetContent) targetContent.style.display = 'block';

        function updateTranslator() {
            const inputEl = document.getElementById('inputText');
            if (!inputEl) return;
            const input = inputEl.value.trim();
            const output = translate(input, state.selectedRegion);
            const outputEl = document.getElementById('outputText');
            const copyBtn = document.getElementById('copyBtn');
            if (input) {
                outputEl.textContent = `"${output}"`;
                copyBtn.style.display = 'block';
            } else {
                outputEl.textContent = '문장을 입력하세요! (예: 안녕하세요)';
                copyBtn.style.display = 'none';
            }
            const examples = EXAMPLES[state.selectedRegion];
            const examplesContainer = document.getElementById('examplesContainer');
            if (examples && examplesContainer) {
                examplesContainer.innerHTML = `<div class="example-title">📚 ${REGIONS.find(r => r.id === state.selectedRegion).name} 주요 인사말 및 사투리 예시 (클릭 시 자동 입력):</div>${examples.map(ex => `<div class="example-item" style="cursor: pointer;" onclick="setInputValue('${ex.std}')"><span class="example-std">📝 ${ex.std}</span> → <span class="example-dialect">${ex.dialect}</span></div>`).join('')}`;
            }
        }

        window.setInputValue = function(text) {

        function copyText() {
            const output = document.getElementById('outputText').textContent;
            const textToCopy = output.replace(/"/g, '');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showCopiedFeedback();
                }).catch(() => {
                    fallbackCopyText(textToCopy);
                });
            } else {
                fallbackCopyText(textToCopy);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback();
            } catch (err) {
                console.error('복사 실패', err);
            }
            document.body.removeChild(textArea);
        }

            initMatchingGame();

        function initMatchingGame() {
            let selectedStd = null;
            const pairs = MATCHING_PAIRS[state.matchRegion];
            const matchedPairs = new Set();
            document.querySelectorAll('.match-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const btn = e.currentTarget;
                    const type = btn.dataset.type;
                    const id = btn.dataset.id;
                    if (btn.classList.contains('matched')) return;
                    if (type === 'std') {
                        document.querySelectorAll('.match-item[data-type="std"]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedStd = id;
                    } else {
                        if (!selectedStd) return;
                        if (selectedStd == id) {
                            document.querySelectorAll(`.match-item[data-id="${id}"]`).forEach(b => {
                                b.classList.remove('selected');
                                b.classList.add('matched');
                            });
                            matchedPairs.add(parseInt(id));
                            selectedStd = null;
                            if (matchedPairs.size === pairs.length) {
                                setTimeout(() => {
                                    const matchScoreEl = document.getElementById('matchScore');
                                    if (matchScoreEl) {
                                        matchScoreEl.style.display = 'block';
                                        matchScoreEl.innerHTML = `🎉 모두 맞췄어요! 완벽합니다!<br><button type="button" class="reset-match-btn" onclick="renderMatching()">처음부터 다시하기</button>`;
                                    }
                                }, 300);
                            }
                        } else {
                            btn.classList.add('wrong');
                            setTimeout(() => btn.classList.remove('wrong'), 500);
                        }
                    }
                });
            });
        }

        function renderBlanks() {
            const sentences = BLANK_SENTENCES[state.blankRegion];
            const container = document.getElementById('blankGameContent');
            if (!container) return;
            container.innerHTML = `<div class="section"><div class="blank-game">${sentences.map((s, i) => `<div style="margin: 15px 0; display:flex; align-items:center; flex-wrap:wrap; gap:10px;"><div>${s.sentence}</div><div><input type="text" class="blank-input" id="blank-${i}" placeholder="정답 입력"><button type="button" class="check-btn" onclick="checkBlank(${i}, '${s.blank}')">확인</button></div></div>`).join('')}</div></div>`;
        }

        window.checkBlank = function(idx, answer) {
            const input = document.getElementById(`blank-${idx}`);
            if (!input) return;
            if (input.value.trim() === answer) {
                input.style.background = '#dcfce7';
                input.style.borderColor = '#22c55e';
            } else {
                input.style.background = '#fee2e2';
                input.style.borderColor = '#ef4444';
            }
        };

        function renderDictionary() {
            const words = DICTIONARY_DATA[state.dictRegion];
            const container = document.getElementById('dictionaryContent');
            if (!container) return;
            container.innerHTML = `<div class="section"><div class="dictionary-grid">${words.map(w => `<div class="dict-card"><div class="dict-std">${w.std}</div><div class="dict-labels">${Object.entries(w.dialects).map(([region, dialect]) => `<span class="dict-label">${REGIONS.find(r => r.id === region).name}: ${dialect}</span>`).join('')}</div></div>`).join('')}</div></div>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => switchTab(e.target.dataset.tab));
            });
            const inputEl = document.getElementById('inputText');
            if (inputEl) {
                inputEl.addEventListener('input', updateTranslator);
            }
            const copyBtn = document.getElementById('copyBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', copyText);
            }
            init();
        });
    </script>
</body>
</html>
