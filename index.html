            }
            return result;

        function initRegions(containerId, stateKey) {
            const container = document.getElementById(containerId);
            container.innerHTML = REGIONS.map(r => `<button class="region-btn ${r.id === state[stateKey] ? 'active' : ''}" data-region="${r.id}"><div class="region-icon">${r.icon}</div><div class="region-name">${r.name}</div></button>`).join('');
            container.querySelectorAll('.region-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state[stateKey] = e.currentTarget.dataset.region;
                    init();
                });
            });
        }

        function switchTab(tab) {
            state.tab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(tab).style.display = 'block';
        }

        function updateTranslator() {
            const input = document.getElementById('inputText').value.trim();
            const output = translate(input, state.selectedRegion);
            const outputEl = document.getElementById('outputText');
            const copyBtn = document.getElementById('copyBtn');
            if (output && output !== input) {
                outputEl.textContent = `"${output}"`;
                copyBtn.style.display = 'block';
            } else {
                outputEl.textContent = '문장을 입력하세요!';
                copyBtn.style.display = 'none';
            }
            const examples = EXAMPLES[state.selectedRegion];
            if (examples) {
                document.getElementById('examplesContainer').innerHTML = `<div class="example-title">📚 ${REGIONS.find(r => r.id === state.selectedRegion).name} 사투리 예시:</div>${examples.map(ex => `<div class="example-item"><span class="example-std">${ex.std}</span> → <span class="example-dialect">${ex.dialect}</span></div>`).join('')}`;
            }
        }

        function copyText() {
            const output = document.getElementById('outputText').textContent;
            navigator.clipboard.writeText(output.replace(/"/g, ''));

            btn.textContent = '✅ 복사됨!';

                return;
            }
            quizContainer.innerHTML = `<div class="section"><div class="quiz-header"><span>문제 ${state.quizIdx + 1} / ${QUIZ_DATA.length}</span><span>점수: ${state.quizScore}</span></div><div class="quiz-question">Q. ${q.q}</div><div class="quiz-options">${q.opts.map((opt, i) => `<button class="option-btn" onclick="answerQuiz(${i})" ${state.quizAnswered ? 'disabled' : ''}>${i + 1}. ${opt}</button>`).join('')}</div>${state.quizAnswered ? `<div class="feedback"><div class="feedback-title">${state.quizSelectedAnswer === q.ans ? '✅ 정답!' : '❌ 틀렸어요!'}</div><div class="feedback-text">${q.exp}</div><button class="next-btn" onclick="nextQuiz()">${state.quizIdx + 1 === QUIZ_DATA.length ? '결과 확인' : '다음 문제 ➜'}</button></div>` : ''}</div>`;
            if (state.quizAnswered) {
                document.querySelectorAll('.option-btn').forEach((btn, i) => {
                    btn.classList.remove('correct', 'wrong', 'disabled');
                    if (i === q.ans) btn.classList.add('correct');
                    else if (i === state.quizSelectedAnswer) btn.classList.add('wrong');
                    else btn.classList.add('disabled');
                });
            }
        }

        function answerQuiz(idx) {
            if (state.quizAnswered) return;
            state.quizSelectedAnswer = idx;
            state.quizAnswered = true;
            if (idx === QUIZ_DATA[state.quizIdx].ans) {
                state.quizScore++;
            }
            renderQuiz();
        }

        function nextQuiz() {
            if (state.quizIdx + 1 < QUIZ_DATA.length) {
                state.quizIdx++;
                state.quizAnswered = false;
                state.quizSelectedAnswer = null;
            } else {
                state.quizDone = true;
            }
            renderQuiz();
        }

        function resetQuiz() {
            state.quizIdx = 0;
            state.quizScore = 0;
            state.quizAnswered = false;
            state.quizSelectedAnswer = null;
            state.quizDone = false;
            renderQuiz();
        }

        function renderMatching() {
            const pairs = MATCHING_PAIRS[state.matchRegion];
            const container = document.getElementById('matchingGameContent');
            const shuffledDialect = [...pairs].sort(() => Math.random() - 0.5);
            container.innerHTML = `<div class="section"><div class="matching-grid"><div class="matching-column"><div style="font-weight: bold; margin-bottom: 10px;">표준어</div>${pairs.map((p) => `<button class="match-item" data-type="std" data-id="${p.id}">${p.std}</button>`).join('')}</div><div class="matching-column"><div style="font-weight: bold; margin-bottom: 10px;">사투리</div>${shuffledDialect.map((p) => `<button class="match-item" data-type="dialect" data-id="${p.id}">${p.dialect}</button>`).join('')}</div></div><div class="match-score" id="matchScore" style="display:none;"></div></div>`;
            initMatchingGame();
        }

        function initMatchingGame() {
            let selectedStd = null;
            const pairs = MATCHING_PAIRS[state.matchRegion];
            const matchedPairs = new Set();
            document.querySelectorAll('.match-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const btn = e.currentTarget;
                    const type = btn.dataset.type;
                    const id = btn.dataset.id;
                    if (btn.classList.contains('matched')) return;
                    if (type === 'std') {
                        document.querySelectorAll('.match-item[data-type="std"]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedStd = id;
                    } else {
                        if (!selectedStd) return;
                        if (selectedStd == id) {
                            document.querySelectorAll(`.match-item[data-id="${id}"]`).forEach(b => {
                                b.classList.remove('selected');
                                b.classList.add('matched');
                            });
                            matchedPairs.add(parseInt(id));
                            selectedStd = null;
                            if (matchedPairs.size === pairs.length) {
                                setTimeout(() => {
                                    document.getElementById('matchScore').style.display = 'block';
                                    document.getElementById('matchScore').innerHTML = `🎉 모두 맞췄어요! 완벽합니다!<button class="reset-match-btn" onclick="location.reload()">처음부터</button>`;
                                }, 300);
                            }
                        } else {
                            btn.classList.add('wrong');
                            setTimeout(() => btn.classList.remove('wrong'), 500);
                        }
                    }
                });
            });
        }

        function renderBlanks() {
            const sentences = BLANK_SENTENCES[state.blankRegion];
            const container = document.getElementById('blankGameContent');
            container.innerHTML = `<div class="section"><div class="blank-game">${sentences.map((s, i) => `<div style="margin: 15px 0;"><div>${s.sentence}</div><input type="text" class="blank-input" id="blank-${i}" placeholder="정답 입력"><button class="check-btn" onclick="checkBlank(${i}, '${s.blank}')">확인</button></div>`).join('')}</div></div>`;
        }

        function checkBlank(idx, answer) {
            const input = document.getElementById(`blank-${idx}`);
            if (input.value === answer) {
                input.style.background = '#dcfce7';
                input.style.borderColor = '#22c55e';
            } else {
                input.style.background = '#fee2e2';
                input.style.borderColor = '#ef4444';
            }
        }

        function renderDictionary() {
            const words = DICTIONARY_DATA[state.dictRegion];
            const container = document.getElementById('dictionaryContent');
            container.innerHTML = `<div class="section"><div class="dictionary-grid">${words.map(w => `<div class="dict-card"><div class="dict-std">${w.std}</div><div class="dict-labels">${Object.entries(w.dialects).map(([region, dialect]) => `<span class="dict-label">${REGIONS.find(r => r.id === region).name}: ${dialect}</span>`).join('')}</div></div>`).join('')}</div></div>`;
        }

        init();
    </script>
</body>
</html>
